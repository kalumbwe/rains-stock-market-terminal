<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#f97316" stroke-opacity="0.35" stroke-width="6"/>
  <!-- candlesticks -->
  <g stroke-linecap="round">
    <line x1="150" y1="150" x2="150" y2="300" stroke="#34d399" stroke-width="14"/>
    <rect x="122" y="188" width="56" height="76" rx="10" fill="#34d399"/>
    <line x1="256" y1="120" x2="256" y2="330" stroke="#f97316" stroke-width="14"/>
    <rect x="228" y="168" width="56" height="104" rx="10" fill="#f97316"/>
    <line x1="362" y1="180" x2="362" y2="352" stroke="#fb7185" stroke-width="14"/>
    <rect x="334" y="224" width="56" height="80" rx="10" fill="#fb7185"/>
  </g>
  <!-- pulse -->
  <polyline points="76,404 176,404 216,344 268,452 316,392 348,404 436,404"
    fill="none" stroke="url(#pulse)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
